version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: controle_estoque
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: back-end-app-1
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: controle_estoque
      DB_PORT: 3306
      JWT_SECRET: sua_chave_secreta
      JWT_EXPIRES_IN: 8h
    depends_on:
      - db